<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Activity POC</title>
    <style>
      /* CC0 (see assets/font/pkmn_ds/license.txt) -- free to use with no
         attribution required, kept in the repo anyway since it travels
         with the font file by the FontStruct author's own request. */
      @font-face {
        font-family: "Pokemon DS";
        src: url("/assets/pokemon-ds.otf") format("opentype");
        font-display: swap;
      }
      /* Themed, not applied everywhere: this is a tile font meant for
         short labels at a deliberate size, and reads badly as dense
         paragraph text. Scoped to headings/titles/buttons below; #log
         (diagnostic output, not player-facing UI) stays on the system
         font on purpose -- legible debug text matters more there than
         theming does. */

      /* Discord's Activity iframe is dark and our text was defaulting to
         black, which made everything but the big bold h1 effectively
         invisible. Explicit colors, and top padding so the heading isn't
         under Discord's own floating header. */
      body {
        margin: 0;
        padding: 56px 16px 24px;
        background: #1e1f22;
        color: #f2f3f5;
        font-family: system-ui, -apple-system, sans-serif;
      }
      h1 {
        font-family: "Pokemon DS", system-ui, -apple-system, sans-serif;
        font-size: 22px;
        letter-spacing: 0.02em;
        margin: 0 0 12px;
      }
      #party {
        margin: 0 0 20px;
        padding-left: 22px;
        font-size: 16px;
      }

      /* Six columns x five rows is the box shape the mainline games use,
         and the shape Green's BOX_SIZE of 30 assumes. Fixed columns
         rather than auto-fill so a box looks like a box at any width --
         the cells shrink on a narrow phone instead of the grid reflowing
         into a different arrangement than the one on a desktop. */
      #pc {
        margin: 0 0 20px;
      }
      .pc-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      .pc-title {
        font-family: "Pokemon DS", system-ui, -apple-system, sans-serif;
        font-size: 18px;
      }
      .pc-count {
        font-size: 12px;
        color: #b5bac1;
      }
      .pc-nav {
        background: #2b2d31;
        color: #f2f3f5;
        border: 1px solid #3f4147;
        border-radius: 6px;
        font-size: 18px;
        line-height: 1;
        padding: 8px 14px;
        cursor: pointer;
      }
      .pc-nav:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .pc-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 4px;
      }
      .pc-cell {
        position: relative;
        aspect-ratio: 1;
        background: #2b2d31;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pc-cell.empty {
        background: #232428;
      }
      .pc-cell.filled {
        cursor: pointer;
      }
      .pc-cell.filled:active {
        background: #35373c;
      }
      .pc-cell img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        /* Sprites are small GIFs meant to be seen at this size; letting
           the browser smooth them turns them to mush. */
        image-rendering: pixelated;
      }
      .pc-cell .shiny {
        position: absolute;
        top: 2px;
        right: 3px;
        font-size: 10px;
      }
      .pc-cell .lvl {
        position: absolute;
        bottom: 1px;
        left: 4px;
        font-size: 9px;
        color: #b5bac1;
      }
      /* A full-screen overlay rather than an inline expansion: a phone
         screen is narrow enough that a card next to a 6-wide grid would
         either be too cramped to read or push the grid off to one side.
         Fixed positioning also means opening it can't itself change the
         page's scroll position, which a layout change in the flow would.

         Centered rather than the bottom sheet this started as: the border
         atlas is a complete framed dialogue box, all four corners
         rounded, meant to be seen whole -- a bottom sheet would flatten
         its bottom edge off-screen and use only 2 of its 3 border tiles.
         A floating box is also just the more natural home for game-style
         dialogue art in the first place. */
      #summary-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        z-index: 10;
      }
      #summary-card {
        width: 100%;
        max-width: 360px;
        max-height: 80vh;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 16px;
        /* border-radius has no effect on border-image (the two don't
           compose in any browser) -- the rounding here is baked into the
           art's own corner tiles, not a CSS property. */
        border-style: solid;
        border-width: 24px;
        border-image-source: url("/assets/summary-atlas.png");
        /* 16: the real tile size in the (pre-cropped, see server.js's
           STATIC_ASSETS) 48x48 source -- a 3x3 grid of 16px squares, so
           one slice value cuts all four the same way. fill: the 9th,
           center tile (a subtle dot-grid) becomes the card's actual
           background instead of empty space showing whatever is behind
           the border. */
        border-image-slice: 16 fill;
        border-image-width: 24px;
        /* round rather than the stretch default: stretch would smear the
           dot-grid fill and the straight edge tiles into blur trying to
           cover a height CSS doesn't know ahead of time (the card's
           height depends on which Pokemon is open). round rescales to
           fit a whole number of tiles instead of stretching a fraction of
           one, so the pattern repeats cleanly regardless of content
           length. */
        border-image-repeat: round;
        image-rendering: pixelated;
      }
      .summary-head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .summary-head img {
        width: 56px;
        height: 56px;
        object-fit: contain;
        image-rendering: pixelated;
        flex-shrink: 0;
      }
      .summary-name {
        font-family: "Pokemon DS", system-ui, -apple-system, sans-serif;
        font-size: 20px;
      }
      .summary-sub {
        font-size: 12px;
        color: #b5bac1;
      }
      .summary-close {
        margin-left: auto;
        background: none;
        border: none;
        color: #b5bac1;
        font-size: 22px;
        line-height: 1;
        padding: 4px 8px;
        cursor: pointer;
      }
      .summary-section {
        margin-bottom: 14px;
      }
      .summary-section h3 {
        font-family: "Pokemon DS", system-ui, -apple-system, sans-serif;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #b5bac1;
        margin: 0 0 6px;
      }
      .summary-hpbar {
        height: 6px;
        border-radius: 3px;
        background: #1e1f22;
        overflow: hidden;
        margin-bottom: 4px;
      }
      .summary-hpbar-fill {
        height: 100%;
        background: #3ba55c;
      }
      .summary-row {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        padding: 3px 0;
        border-bottom: 1px solid #35373c;
      }
      .summary-row span:first-child {
        color: #b5bac1;
      }
      .summary-moves {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .summary-move {
        background: #1e1f22;
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 12px;
      }
      .summary-move .move-name {
        font-weight: 600;
      }
      .summary-move .move-pp {
        color: #b5bac1;
        font-size: 11px;
      }
      #log {
        font-size: 12px;
        line-height: 1.6;
        color: #b5bac1;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #log .err {
        color: #ff7b72;
      }
    </style>
  </head>
  <body>
    <h1 id="status">Connecting to Discord...</h1>
    <ul id="party"></ul>
    <div id="pc"></div>
    <div id="log"></div>
    <script>
      window.DISCORD_CLIENT_ID = "%%DISCORD_CLIENT_ID%%";
      window.SERVER_BOOT = "%%SERVER_BOOT%%";
    </script>
    <!-- ?v=<content hash>: see BUNDLE_VERSION in server.js -- the query
         string is what stops a cache from serving an old build forever.
         The router matches on pathname, so it reaches serveBundle. -->
    <script src="/bundle.js?v=%%BUNDLE_VERSION%%"></script>
  </body>
</html>
