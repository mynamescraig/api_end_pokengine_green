<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Activity POC</title>
    <style>
      /* Discord's Activity iframe is dark and our text was defaulting to
         black, which made everything but the big bold h1 effectively
         invisible. Explicit colors, and top padding so the heading isn't
         under Discord's own floating header. */
      body {
        margin: 0;
        padding: 56px 16px 24px;
        background: #1e1f22;
        color: #f2f3f5;
        font-family: system-ui, -apple-system, sans-serif;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      #party {
        margin: 0 0 20px;
        padding-left: 22px;
        font-size: 16px;
      }

      /* Six columns x five rows is the box shape the mainline games use,
         and the shape Green's BOX_SIZE of 30 assumes. Fixed columns
         rather than auto-fill so a box looks like a box at any width --
         the cells shrink on a narrow phone instead of the grid reflowing
         into a different arrangement than the one on a desktop. */
      #pc {
        margin: 0 0 20px;
      }
      .pc-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      .pc-title {
        font-size: 16px;
        font-weight: 600;
      }
      .pc-count {
        font-size: 12px;
        color: #b5bac1;
      }
      .pc-nav {
        background: #2b2d31;
        color: #f2f3f5;
        border: 1px solid #3f4147;
        border-radius: 6px;
        font-size: 18px;
        line-height: 1;
        padding: 8px 14px;
        cursor: pointer;
      }
      .pc-nav:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .pc-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 4px;
      }
      .pc-cell {
        position: relative;
        aspect-ratio: 1;
        background: #2b2d31;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pc-cell.empty {
        background: #232428;
      }
      .pc-cell img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        /* Sprites are small GIFs meant to be seen at this size; letting
           the browser smooth them turns them to mush. */
        image-rendering: pixelated;
      }
      .pc-cell .shiny {
        position: absolute;
        top: 2px;
        right: 3px;
        font-size: 10px;
      }
      .pc-cell .lvl {
        position: absolute;
        bottom: 1px;
        left: 4px;
        font-size: 9px;
        color: #b5bac1;
      }
      #log {
        font-size: 12px;
        line-height: 1.6;
        color: #b5bac1;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #log .err {
        color: #ff7b72;
      }
    </style>
  </head>
  <body>
    <h1 id="status">Connecting to Discord...</h1>
    <ul id="party"></ul>
    <div id="pc"></div>
    <div id="log"></div>
    <script>
      window.DISCORD_CLIENT_ID = "%%DISCORD_CLIENT_ID%%";
      window.SERVER_BOOT = "%%SERVER_BOOT%%";
    </script>
    <!-- ?v=<content hash>: see BUNDLE_VERSION in server.js -- the query
         string is what stops a cache from serving an old build forever.
         The router matches on pathname, so it reaches serveBundle. -->
    <script src="/bundle.js?v=%%BUNDLE_VERSION%%"></script>
  </body>
</html>
