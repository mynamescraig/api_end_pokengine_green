<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Activity POC</title>
    <style>
      /* Discord's Activity iframe is dark and our text was defaulting to
         black, which made everything but the big bold h1 effectively
         invisible. Explicit colors, and top padding so the heading isn't
         under Discord's own floating header. */
      body {
        margin: 0;
        padding: 56px 16px 24px;
        background: #1e1f22;
        color: #f2f3f5;
        font-family: system-ui, -apple-system, sans-serif;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      #party {
        margin: 0 0 20px;
        padding-left: 22px;
        font-size: 16px;
      }

      /* Six columns x five rows is the box shape the mainline games use,
         and the shape Green's BOX_SIZE of 30 assumes. Fixed columns
         rather than auto-fill so a box looks like a box at any width --
         the cells shrink on a narrow phone instead of the grid reflowing
         into a different arrangement than the one on a desktop. */
      #pc {
        margin: 0 0 20px;
      }
      .pc-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      .pc-title {
        font-size: 16px;
        font-weight: 600;
      }
      .pc-count {
        font-size: 12px;
        color: #b5bac1;
      }
      .pc-nav {
        background: #2b2d31;
        color: #f2f3f5;
        border: 1px solid #3f4147;
        border-radius: 6px;
        font-size: 18px;
        line-height: 1;
        padding: 8px 14px;
        cursor: pointer;
      }
      .pc-nav:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .pc-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 4px;
      }
      .pc-cell {
        position: relative;
        aspect-ratio: 1;
        background: #2b2d31;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pc-cell.empty {
        background: #232428;
      }
      .pc-cell.filled {
        cursor: pointer;
      }
      .pc-cell.filled:active {
        background: #35373c;
      }
      .pc-cell img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        /* Sprites are small GIFs meant to be seen at this size; letting
           the browser smooth them turns them to mush. */
        image-rendering: pixelated;
      }
      .pc-cell .shiny {
        position: absolute;
        top: 2px;
        right: 3px;
        font-size: 10px;
      }
      .pc-cell .lvl {
        position: absolute;
        bottom: 1px;
        left: 4px;
        font-size: 9px;
        color: #b5bac1;
      }
      /* A full-screen overlay rather than an inline expansion: a phone
         screen is narrow enough that a card next to a 6-wide grid would
         either be too cramped to read or push the grid off to one side.
         Fixed positioning also means opening it can't itself change the
         page's scroll position, which a layout change in the flow would. */
      #summary-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: flex-end;
        z-index: 10;
      }
      #summary-card {
        background: #2b2d31;
        border-radius: 12px 12px 0 0;
        padding: 16px;
        width: 100%;
        max-height: 80vh;
        overflow-y: auto;
        box-sizing: border-box;
      }
      .summary-head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .summary-head img {
        width: 56px;
        height: 56px;
        object-fit: contain;
        image-rendering: pixelated;
        flex-shrink: 0;
      }
      .summary-name {
        font-size: 18px;
        font-weight: 600;
      }
      .summary-sub {
        font-size: 12px;
        color: #b5bac1;
      }
      .summary-close {
        margin-left: auto;
        background: none;
        border: none;
        color: #b5bac1;
        font-size: 22px;
        line-height: 1;
        padding: 4px 8px;
        cursor: pointer;
      }
      .summary-section {
        margin-bottom: 14px;
      }
      .summary-section h3 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #b5bac1;
        margin: 0 0 6px;
      }
      .summary-hpbar {
        height: 6px;
        border-radius: 3px;
        background: #1e1f22;
        overflow: hidden;
        margin-bottom: 4px;
      }
      .summary-hpbar-fill {
        height: 100%;
        background: #3ba55c;
      }
      .summary-row {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        padding: 3px 0;
        border-bottom: 1px solid #35373c;
      }
      .summary-row span:first-child {
        color: #b5bac1;
      }
      .summary-moves {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .summary-move {
        background: #1e1f22;
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 12px;
      }
      .summary-move .move-name {
        font-weight: 600;
      }
      .summary-move .move-pp {
        color: #b5bac1;
        font-size: 11px;
      }
      #log {
        font-size: 12px;
        line-height: 1.6;
        color: #b5bac1;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #log .err {
        color: #ff7b72;
      }
    </style>
  </head>
  <body>
    <h1 id="status">Connecting to Discord...</h1>
    <ul id="party"></ul>
    <div id="pc"></div>
    <div id="log"></div>
    <script>
      window.DISCORD_CLIENT_ID = "%%DISCORD_CLIENT_ID%%";
      window.SERVER_BOOT = "%%SERVER_BOOT%%";
    </script>
    <!-- ?v=<content hash>: see BUNDLE_VERSION in server.js -- the query
         string is what stops a cache from serving an old build forever.
         The router matches on pathname, so it reaches serveBundle. -->
    <script src="/bundle.js?v=%%BUNDLE_VERSION%%"></script>
  </body>
</html>
